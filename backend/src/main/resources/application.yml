spring:
  application:
    name: spamshield-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/spamshield?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:spamshield}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# JWT configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000  # 24 hours

# ML service
ml:
  service:
    url: ${ML_SERVICE_URL:http://127.0.0.1:8000}
    timeout-ms: 10000

# CORS — IMPORTANT: Set CORS_ALLOWED_ORIGINS env var on Render to your Vercel URL
# e.g. CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator - restrict exposure
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.spamshield: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
