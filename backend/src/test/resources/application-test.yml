spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-key-that-is-at-least-32-characters-long-for-tests
  expiration-ms: 3600000

ml:
  service:
    url: http://127.0.0.1:8099  # Should not be reachable in tests
    timeout-ms: 1000

cors:
  allowed-origins: http://localhost:5173

logging:
  level:
    com.spamshield: WARN
