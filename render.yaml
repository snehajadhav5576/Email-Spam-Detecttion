services:
  # ─────────────────────────────────────────────────────────────────
  # 1. Python ML Service  →  https://spamshield-ml.onrender.com
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: spamshield-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt && python training/train.py
    startCommand: python start.py
    envVars:
      - key: PORT
        value: 10000        # Render free tier uses 10000 by default
      - key: HOST
        value: 0.0.0.0
    healthCheckPath: /health

  # ─────────────────────────────────────────────────────────────────
  # 2. Spring Boot Backend  →  https://spamshield-backend.onrender.com
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: spamshield-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: chmod +x mvnw && ./mvnw -q -DskipTests clean package
    startCommand: java -jar target/spamshield-backend-1.0.0.jar
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DB_URL
        sync: false          # ← Set in Render dashboard
      - key: DB_USERNAME
        sync: false          # ← Set in Render dashboard
      - key: DB_PASSWORD
        sync: false          # ← Set in Render dashboard
      - key: JWT_SECRET
        sync: false          # ← Set in Render dashboard
      - key: ML_SERVICE_URL
        sync: false          # ← Set to your spamshield-ml Render URL
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # ← Set to your Vercel frontend URL e.g. https://your-app.vercel.app
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://*.vercel.app"   # Allows ALL Vercel preview deployments automatically
    healthCheckPath: /actuator/health
